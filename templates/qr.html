<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator - Python Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl">
                    <i class="fas fa-tools"></i>
                </div>
                <span class="text-2xl font-bold text-gray-900">Python Tools</span>
            </div>
            <div class="flex items-center gap-8">
                <a href="/" class="text-gray-600 hover:text-gray-900 transition">Home</a>
                <a href="/image" class="text-gray-600 hover:text-gray-900 transition">Image</a>
                <a href="/pdf" class="text-gray-600 hover:text-gray-900 transition">PDF</a>
                <a href="/qr" class="text-emerald-600 font-medium border-b-2 border-emerald-600 pb-1">QR</a>
                <a href="/video" class="text-gray-600 hover:text-gray-900 transition">Video</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <div class="w-20 h-20 bg-emerald-100 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-qrcode text-5xl text-emerald-600"></i>
            </div>
            <h1 class="text-5xl font-bold text-gray-900">QR Generator</h1>
            <p class="text-gray-600 mt-4 text-xl">Create high-quality QR codes instantly</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl p-10">
            <form action="/generate-qr" method="POST" class="space-y-8">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Enter Text or URL</label>
                    <input type="text" name="text" placeholder="https://example.com or any text" required
                           class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-emerald-500 text-lg">
                </div>

                <button type="submit" 
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 rounded-2xl text-lg transition flex items-center justify-center gap-2">
                    <i class="fas fa-qrcode"></i>
                    Generate QR Code
                </button>
            </form>
        </div>
    </div>
</body>
</html>

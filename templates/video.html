<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Composer - Python Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl">
                    <i class="fas fa-tools"></i>
                </div>
                <span class="text-2xl font-bold text-gray-900">Python Tools</span>
            </div>
            <div class="flex items-center gap-8">
                <a href="/" class="text-gray-600 hover:text-gray-900 transition">Home</a>
                <a href="/image" class="text-gray-600 hover:text-gray-900 transition">Image</a>
                <a href="/pdf" class="text-gray-600 hover:text-gray-900 transition">PDF</a>
                <a href="/qr" class="text-gray-600 hover:text-gray-900 transition">QR</a>
                <a href="/video" class="text-purple-600 font-medium border-b-2 border-purple-600 pb-1">Video</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <div class="w-20 h-20 bg-purple-100 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-video text-5xl text-purple-600"></i>
            </div>
            <h1 class="text-5xl font-bold text-gray-900">Video Composer</h1>
            <p class="text-gray-600 mt-4 text-xl">Merge multiple videos into one seamlessly</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl p-10">
            <form action="/merge-video" method="POST" enctype="multipart/form-data" class="space-y-8">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload Videos</label>
                    <input type="file" name="videos" multiple required accept="video/*"
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-4 file:px-6 file:rounded-2xl file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                    <p class="text-xs text-gray-500 mt-2">Select multiple video files</p>
                </div>

                <button type="submit" 
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-4 rounded-2xl text-lg transition flex items-center justify-center gap-2">
                    <i class="fas fa-film"></i>
                    Merge Videos
                </button>
            </form>
        </div>
    </div>
</body>
</html>
